<text x="636" y="424" font-size="13" font-weight="bold" fill="#111">Each channel (repeat x6, identical to the proven single channel)</text>
<text x="636" y="448" font-size="11" fill="#444">Gate: ESP32 GPIO -> 100 ohm -> MOSFET gate. 10k gate to GND rail.</text>
<text x="636" y="465" font-size="11" fill="#444">Drain: inverter V- (ground return) to MOSFET drain.</text>
<text x="636" y="482" font-size="11" fill="#444">Source: MOSFET source to the common ground rail.</text>
<text x="636" y="499" font-size="11" fill="#444">Inverter V+ to the +5V rail. EL output goes to that channel's wire.</text>
<text x="636" y="516" font-size="11" fill="#444">FQP30N06L (TO-220): pin1 Gate, pin2 Drain (+tab), pin3 Source.</text>
<text x="636" y="533" font-size="11" fill="#444">Legend: red +5V, black ground/return, teal 3.3V gate signal.</text>
