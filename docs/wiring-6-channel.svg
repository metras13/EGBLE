<text x="656" y="434" font-size="11" fill="#444">switched ground return: inverter V- to MOSFET DRAIN (one node per channel)</text>
<line x1="616" y1="450" x2="648" y2="450" stroke="#111" stroke-width="3"/>
<text x="656" y="454" font-size="11" fill="#444">common ground: MOSFET SOURCE to the shared ground rail</text>
