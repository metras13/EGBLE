<text x="656" y="474" font-size="11" fill="#444">+5V: supply to every inverter V+</text>
<line x1="616" y1="490" x2="648" y2="490" stroke="#0a9" stroke-width="3"/>
<text x="656" y="494" font-size="11" fill="#444">gate: GPIO to 100 ohm to gate, 10k gate to ground</text>
<text x="616" y="522" font-size="11" fill="#c0392b" font-weight="bold">The six drains are separate. Never tie a drain (inverter V-) to</text>
<text x="616" y="538" font-size="11" fill="#c0392b" font-weight="bold">the ground rail or to another drain, or that channel is stuck on.</text>
<text x="616" y="556" font-size="10" fill="#666">FQP30N06L TO-220: pin1 Gate, pin2 Drain (+tab), pin3 Source.</text>
